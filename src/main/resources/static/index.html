<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #8b5cf6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-weight: 700;
            font-size: 3rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 1rem 0;
            animation: fadeInDown 0.5s ease-out;
        }

        p.subtitle {
            color: var(--text-muted);
            margin: 0 0 3rem 0;
            font-size: 1.2rem;
            animation: fadeInDown 0.6s ease-out;
        }

        .app-links {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .app-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            animation: fadeInUp 0.7s ease-out both;
        }

        .app-card:nth-child(2) {
            animation-delay: 0.1s;
        }

        .app-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -8px rgba(0, 0, 0, 0.5);
            border-color: var(--primary);
        }

        .app-info {
            text-align: left;
        }

        .app-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .app-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .app-arrow {
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .app-card:hover .app-arrow {
            transform: translateX(5px);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Application Hub</h1>
        <p class="subtitle">Select an application to launch</p>

        <div class="app-links">
            <a href="/poker.html" class="app-card">
                <div class="app-info">
                    <div class="app-title">Agile Poker</div>
                    <div class="app-desc">Real-time collaborative estimation game for agile teams.</div>
                </div>
                <div class="app-arrow">&rarr;</div>
            </a>

            <a href="/hello.html" class="app-card">
                <div class="app-info">
                    <div class="app-title">Hello World</div>
                    <div class="app-desc">A simple static demonstration site.</div>
                </div>
                <div class="app-arrow">&rarr;</div>
            </a>

            <a href="/swagger-ui/index.html" class="app-card" style="animation-delay: 0.2s;">
                <div class="app-info">
                    <div class="app-title">API Specification</div>
                    <div class="app-desc">Interactive Swagger UI OpenAPI documentation.</div>
                </div>
                <div class="app-arrow">&rarr;</div>
            </a>
        </div>
    </div>
</body>
</html>
